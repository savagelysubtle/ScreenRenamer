[project]
name = "screenrenamer"
version = "0.1.0"
description = "AI-powered screenshot renamer using local LLM vision models"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "watchdog>=4.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pillow>=10.0.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
    "hf_xet>=1.0.0",
    "accelerate>=0.25.0",
    "plyer>=2.1.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]

# Optional: Define entry points for CLI commands
[project.scripts]
screenrenamer = "screenrenamer.cli:main"

# ============================================================================
# UV BUILD BACKEND CONFIGURATION
# !! AI AGENTS: DO NOT MODIFY THIS SECTION !!
# This configuration is required for UV to properly build the package
# ============================================================================
[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.9.4,<0.10.0"]  #!! AI LEAVE THIS - IT IS CORRECT

[tool.setuptools]
# Package discovery for UV build backend
packages = { find = { where = ["src"], include = ["screenrenamer*"] } }

# ============================================================================
# RUFF LINTER & FORMATTER CONFIGURATION
# ============================================================================

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort (import sorting)
    "B",    # flake8-bugbear (detect common bugs)
    "C4",    # flake8-comprehensions (better comprehensions)
    "UP",    # pyupgrade (upgrade syntax for newer Python)
    "SIM",   # flake8-simplify (simplify code)
    "RUF",   # Ruff-specific rules
]

ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex (function is too complex)
    "B905",  # zip() without an explicit strict= parameter
]

fixable = ["ALL"]
unfixable = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
"tests/**" = ["S101", "PLR2004", "D"]
"**/test_*.py" = ["S101", "PLR2004", "D"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.isort]
known-first-party = ["screenrenamer"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

# ============================================================================
# TY TYPE CHECKER CONFIGURATION
# ============================================================================

[tool.ty.environment]
root = ["src"]
python-version = "3.14"

[tool.ty.terminal]
output-format = "full"
error-on-warning = false

[tool.ty.rules]
# Add any custom rules here if needed

# ============================================================================
# DEVELOPMENT DEPENDENCIES
# ============================================================================

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pre-commit>=3.0.0",
]

# ============================================================================
# TOOL CONFIGURATIONS
# ============================================================================

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv]
link-mode = "copy"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124" },
]
torchvision = [
    { index = "pytorch-cu124" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=screenrenamer",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=80",
]
